
name: Build in linux

on:
  workflow_dispatch:
    
jobs:
  build_engine:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v3
       

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      - name: Build engine
        run: |
          sudo apt-add-repository "deb http://archive.ubuntu.com/ubuntu jammy main universe"
          sudo apt-get update
          sudo apt-get install build-essential clang lld g++-12 cmake ninja-build libvulkan1 python3 python3-dev python3-pip libpng-dev libtiff5-dev libjpeg-dev tzdata sed curl unzip autoconf libtool rsync libxml2-dev git git-lfs
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 180
          chmod +x Setup.sh
          chmod +x GenerateProjectFiles.sh
          chmod +x Engine/Build/BatchFiles/Linux/GitDependencies.sh
          # insufficient disk space
          ./Setup.sh
          ./GenerateProjectFiles.sh
          make
        
